services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shop_backend_app

    ports:
      - "8081:8080"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped
    networks:
      - shop_backend_network
      - proxy

    volumes:
      - uploads_data:/app/uploads

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shopbackend.rule=Host(`${API_HOST:-api.shop.local}`)"
      - "traefik.http.routers.shopbackend.entrypoints=websecure"
      - "traefik.http.routers.shopbackend.tls=true"
      - "traefik.http.routers.shopbackend.tls.certresolver=letsencrypt"
      - "traefik.http.services.shopbackend.loadbalancer.server.port=8080"
      - "traefik.http.routers.shopbackend.middlewares=secureHeaders@file,compression@file"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  postgres:

    image: postgres:17

    container_name: shop_backend_postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shop_backend_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  redis:
    image: redis:7
    container_name: shop_backend_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - shop_backend_network

  backup:
    image: postgres:17

    container_name: shop_backend_backup

    restart: "no"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./docker/postgres:/scripts
      - ./backups:/backups
      - uploads_data:/app/uploads

    working_dir: /scripts

    entrypoint: ["/bin/bash"]

    networks:
      - shop_backend_network



volumes:
  postgres_data:
  uploads_data:

networks:
  shop_backend_network:
  proxy:
    external: true