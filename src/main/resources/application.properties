########################################
# Common configuration
########################################

spring.application.name=shop_backend
spring.profiles.default=dev

########################################
# JPA
########################################

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

########################################
# Flyway
########################################

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

########################################
# Application
########################################

app.currency-code=FCFA

app.upload.dir=uploads
app.upload.url-prefix=/uploads
app.upload.max-file-size-bytes=5242880
app.upload.max-image-pixels=20000000

# A pending WhatsApp order reserves inventory for this duration. The scheduler
# releases it once the window has elapsed.
app.orders.reservation-duration-minutes=60
app.orders.reservation-expiration-scan-interval-ms=60000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

########################################
# JWT
########################################

jwt.expiration=86400000

########################################
# Server
########################################

server.shutdown=graceful
app.api.base-path=/api/v1
springdoc.swagger-ui.url=${app.api.base-path}/v3/api-docs

########################################
# Info
########################################

info.app.name=Shop Backend
info.app.version=1.0.0

########################################
# Actuator
########################################

management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.probes.enabled=true

management.endpoint.health.show-details=never
