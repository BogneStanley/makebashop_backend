########################################
# Common configuration
########################################

spring.application.name=shop_backend

########################################
# JPA
########################################

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

########################################
# Flyway
########################################

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

########################################
# Application
########################################

app.currency-code=FCFA

########################################
# Admin seed (startup)
########################################

app.admin.seed.enabled=true
app.admin.seed.email=admin@shop.local
app.admin.seed.password=Admin@123456
app.admin.seed.first-name=Admin
app.admin.seed.last-name=User

app.upload.dir=uploads
app.upload.url-prefix=/uploads

########################################
# JWT
########################################

jwt.expiration=86400000

########################################
# Server
########################################

server.shutdown=graceful

########################################
# Info
########################################

info.app.name=Shop Backend
info.app.version=1.0.0

########################################
# Actuator
########################################

management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.probes.enabled=true

management.endpoint.health.show-details=never