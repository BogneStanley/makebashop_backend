########################################
# Spring Profile
########################################

spring.config.activate.on-profile=prod

########################################
# Database
########################################

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

########################################
# Hibernate
########################################

spring.jpa.show-sql=false

########################################
# Upload
########################################

app.upload.public-base-url=${PUBLIC_BASE_URL}

########################################
# JWT
########################################

jwt.secret=${JWT_SECRET}

########################################
# CORS
########################################

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

########################################
# Cookies
########################################

app.auth.cookie.name=access_token
app.auth.cookie.secure=true
app.auth.cookie.same-site=None
app.auth.cookie.path=/

app.cart.cookie.name=guest_cart
app.cart.cookie.secure=true
app.cart.cookie.same-site=None
app.cart.cookie.path=/

########################################
# Logging
########################################

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

########################################
# Redis
########################################

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

########################################
# Management (private Docker network only)
########################################

# The public application listens on 8080. Actuator is intentionally isolated
# on the monitoring network, where Prometheus scrapes it on 8081.
management.server.port=8081
