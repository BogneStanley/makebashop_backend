########################################
# Spring Profile
########################################

spring.config.activate.on-profile=dev

########################################
# Database
########################################

spring.datasource.url=jdbc:postgresql://localhost:5432/shop
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

########################################
# Hibernate
########################################

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

########################################
# Upload
########################################

app.upload.public-base-url=http://localhost:8080

########################################
# JWT
########################################

jwt.secret=32323232323232323232323232323232323232323232

########################################
# CORS
########################################

app.cors.allowed-origins=http://localhost:4200,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

########################################
# Cookies
########################################

app.auth.cookie.name=access_token
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax
app.auth.cookie.path=/

app.cart.cookie.name=guest_cart
app.cart.cookie.secure=false
app.cart.cookie.same-site=Lax
app.cart.cookie.path=/

########################################
# Logging
########################################

logging.level.org.springframework.web=DEBUG

########################################
# Redis
########################################

spring.data.redis.host=localhost
spring.data.redis.port=6379
